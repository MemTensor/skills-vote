jobs_dir: output
job_name: tb_pro_codex_baseline__${now:%Y-%m-%d__%H-%M-%S}
n_attempts: 1
quiet: false
n_concurrent_trials: 8
retry:
  max_retries: 3
  exclude_exceptions:
    - VerifierTimeoutError
    - RewardFileNotFoundError
    - RewardFileEmptyError
    - VerifierOutputParseError
agent_timeout_multiplier: 4.0
environment:
  type: docker
  force_build: false
  delete: false
agents:
  - import_path: skills_vote.harbor.agents:SkillsVoteCodex
    model_name: openai/gpt-5.4-mini
    kwargs:
      reasoning_effort: medium
      reasoning_summary: auto
      version: "0.125.0"
      allowed_skills: []
      allowed_plugins: []
