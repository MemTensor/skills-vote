jobs_dir: output
job_name: tb2_codex_gpt_5_4_mini_medium_hard_recommend_seed_tb_pro_evo__${now:%Y-%m-%d__%H-%M-%S}
n_attempts: 3
quiet: false
n_concurrent_trials: 8
retry:
  max_retries: 3
  exclude_exceptions:
    - VerifierTimeoutError
    - RewardFileNotFoundError
    - RewardFileEmptyError
    - VerifierOutputParseError
agent_timeout_multiplier: 4.0
environment:
  type: docker
  force_build: false
  delete: false
  mounts_json:
    - type: bind
      source: ${skills_vote.seed_skills_dir}
      target: /skills
      read_only: true
agents:
  - import_path: skills_vote.harbor.agents:SkillsVoteCodex
    model_name: openai/gpt-5.4-mini
    kwargs:
      version: "0.125.0"
      reasoning_effort: medium
      reasoning_summary: auto
      allowed_skills: []
      allowed_plugins: []
      recommend:
        skills_dir: /skills
        prompt_path: skills_vote.recommend.prompt:build
datasets:
  - name: terminal-bench
    version: "2.0"
    download_dir: input/tb2
    task_names:
      # scientific-computing
      - bn-fit-modify
      - dna-assembly
      - protein-assembly
      # software-engineering
      - cancel-async-tasks
      - circuit-fibsqrt
      - fix-ocaml-gc
      - gpt2-codegolf
      - make-doom-for-mips
      - make-mips-interpreter
      - path-tracing
      - path-tracing-reverse
      - polyglot-rust-c
      - regex-chess
      - torch-pipeline-parallelism
      - torch-tensor-parallelism
      - write-compressor
      # system-administration
      - configure-git-webserver
      - install-windows-3.11
      # file-operations
      - extract-moves-from-video
      # mathematics
      - feal-differential-cryptanalysis
      - feal-linear-cryptanalysis
      - model-extraction-relu-logits
      # security
      - fix-code-vulnerability
      - password-recovery
      # machine-learning
      - llm-inference-batching-scheduler
      # data-science
      - mcmc-sampling-stan
      - sam-cell-seg
      # data-querying
      - sparql-university
      # model-training
      - train-fasttext
      # video-processing
      - video-processing
skills_vote:
  register_import_paths:
    - skills_vote.harbor.hooks:register_cost
  seed_skills_dir: ${abspath:.skills_vote/tb_pro_search_offline_evolve_task_48_agg_4_ep_1}
