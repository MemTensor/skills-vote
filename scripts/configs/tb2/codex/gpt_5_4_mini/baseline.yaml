jobs_dir: output
job_name: tb2_codex_baseline__${now:%Y-%m-%d__%H-%M-%S}
n_attempts: 5
quiet: false
n_concurrent_trials: 16
retry:
  max_retries: 3
  exclude_exceptions:
    - VerifierTimeoutError
    - RewardFileNotFoundError
    - RewardFileEmptyError
    - VerifierOutputParseError
agent_timeout_multiplier: 4.0
environment:
  type: docker
  force_build: false
  delete: false
agents:
  - import_path: skills_vote.harbor.agents:SkillsVoteCodex
    model_name: openai/gpt-5.4-mini
    kwargs:
      version: "0.125.0"
      reasoning_effort: medium
      reasoning_summary: auto
      allowed_skills: []
      allowed_plugins: []
datasets:
  - name: terminal-bench
    version: "2.0"
    download_dir: input/tb2
skills_vote:
  register_import_paths:
    - skills_vote.harbor.hooks:register_cost
