jobs_dir: output
job_name: tb2_codex_gpt_5_2_medium_curated_skill_search_seed__${now:%Y-%m-%d__%H-%M-%S}
n_attempts: 5
quiet: false
n_concurrent_trials: 16
retry:
  max_retries: 3
  exclude_exceptions:
    - VerifierTimeoutError
    - RewardFileNotFoundError
    - RewardFileEmptyError
    - VerifierOutputParseError
agent_timeout_multiplier: 4.0
environment:
  type: docker
  force_build: false
  delete: false
  mounts_json:
    - type: bind
      source: ${skills_vote.recommend_skills_dir}
      target: /skills
      read_only: true
    - type: bind
      source: ${skills_vote.seed_skills_dir}
      target: /real-skills
      read_only: true
agents:
  - import_path: skills_vote.harbor.agents:SkillsVoteCodex
    model_name: openai/gpt-5.2
    kwargs:
      version: "0.125.0"
      reasoning_effort: medium
      reasoning_summary: auto
      allowed_skills: []
      allowed_plugins: []
      recommend:
        skills_dir: /skills
        install_skills_dir: /real-skills
        prompt_path: skills_vote.recommend.prompt:build
        skills_vote_library_manifest: ${skills_vote.skills_vote_library_manifest}
datasets:
  - name: terminal-bench
    version: "2.0"
    download_dir: input/tb2
skills_vote:
  register_import_paths:
    - skills_vote.harbor.hooks:register_cost
  recommend_skills_dir: /mnt/data/skills
  seed_skills_dir: /mnt/data/skills_origin
  skills_vote_library_manifest: ${abspath:.skills_vote/skills_vote_skill_library_manifest.jsonl}
